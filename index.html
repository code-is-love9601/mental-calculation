<script>

  let num1, num2;

  let streak = localStorage.getItem("streak")
    ? parseInt(localStorage.getItem("streak"))
    : 0;

  let lastPlayed = localStorage.getItem("lastPlayed");

  let correctCount = localStorage.getItem("correctCount")
    ? parseInt(localStorage.getItem("correctCount"))
    : 0;


  function getToughNumber(min, max) {

    let num;

    do {
      num = Math.floor(
        Math.random() * (max - min + 1)
      ) + min;

    } while (
      [10, 12, 20, 25, 50].includes(num)
    );

    return num;
  }


  function newQuestion() {

    num1 = getToughNumber(10, 99);
    num2 = getToughNumber(15, 975);

    // 🔥 Current question save karo
    localStorage.setItem("num1", num1);
    localStorage.setItem("num2", num2);

    showQuestion();
  }


  function showQuestion() {

    document.getElementById("question").innerText =
      `What is ${num1} × ${num2}?`;

    document.getElementById("answer").value = "";

    document.getElementById("result").innerText = "";

    updateDisplays();

    document.getElementById("answer").focus();
  }


  function loadQuestion() {

    let savedNum1 = localStorage.getItem("num1");
    let savedNum2 = localStorage.getItem("num2");

    // 🔥 Agar question pehle se saved hai
    if (savedNum1 !== null && savedNum2 !== null) {

      num1 = parseInt(savedNum1);
      num2 = parseInt(savedNum2);

      showQuestion();

    } else {

      // Pehli baar website khuli
      newQuestion();
    }
  }


  function checkAnswer() {

    let userAnswer =
      document.getElementById("answer").value;

    let correctAnswer = num1 * num2;

    let today = new Date().toDateString();


    // ✅ Correct answer
    if (parseInt(userAnswer) === correctAnswer) {

      document.getElementById("result").innerText =
        "✅ Correct!";


      if (lastPlayed !== today) {

        correctCount = 0;

        lastPlayed = today;

        localStorage.setItem(
          "lastPlayed",
          today
        );
      }


      correctCount++;

      localStorage.setItem(
        "correctCount",
        correctCount
      );


      // 🎯 50 questions complete = +1 streak
      if (correctCount >= 50) {

        streak++;

        correctCount = 0;

        localStorage.setItem(
          "streak",
          streak
        );

        localStorage.setItem(
          "correctCount",
          correctCount
        );

        alert(
          "🎉 You completed 50 questions today! Streak +1 day!"
        );
      }


      updateDisplays();


      // 🔥 Correct hone ke baad hi NEW question
      setTimeout(newQuestion, 1000);

    }


    // ❌ Wrong answer
    else {

      document.getElementById("result").innerText =
        "❌ Wrong. Try again!";

      correctCount = 0;

      localStorage.setItem(
        "correctCount",
        correctCount
      );

      updateDisplays();

      // ❌ New question nahi aayega
    }
  }


  function updateDisplays() {

    document.getElementById("streak").innerText =
      `🔥 Current Streak: ${streak} days`;

    document.getElementById("progress").innerText =
      `📊 Progress: ${correctCount}/50 correct today`;
  }


  // 🚀 Website open/refresh hone par
  // saved question load hoga
  loadQuestion();

</script>
