<!DOCTYPE html>
<html>
<head>
  <title>Daily Math Challenge</title>

  <style>
    body {
      font-family: Arial, sans-serif;
      text-align: center;
      margin-top: 50px;
    }

    input {
      padding: 8px;
      margin: 10px;
    }

    button {
      padding: 10px 20px;
      cursor: pointer;
    }

    #result {
      margin-top: 20px;
      font-weight: bold;
    }

    #streak,
    #progress {
      margin-top: 15px;
      font-size: 18px;
    }
  </style>
</head>

<body>

  <h1>🧠 Daily Math Challenge</h1>

  <h2 id="question"></h2>

  <input
    type="number"
    id="answer"
    placeholder="Enter answer"
  >

  <br>

  <button onclick="checkAnswer()">Submit</button>

  <div id="result"></div>

  <div id="streak"></div>

  <div id="progress"></div>


<script>

  let num1, num2;

  let streak = localStorage.getItem("streak")
    ? parseInt(localStorage.getItem("streak"))
    : 0;

  let lastPlayed = localStorage.getItem("lastPlayed");

  let correctCount = localStorage.getItem("correctCount")
    ? parseInt(localStorage.getItem("correctCount"))
    : 0;


  function getToughNumber(min, max) {

    let num;

    do {
      num = Math.floor(
        Math.random() * (max - min + 1)
      ) + min;

    } while (
      [10, 12, 20, 25, 50].includes(num)
    );

    return num;
  }


  function newQuestion() {

    num1 = getToughNumber(10, 99);
    num2 = getToughNumber(15, 975);

    localStorage.setItem("num1", num1);
    localStorage.setItem("num2", num2);

    showQuestion();
  }


  function showQuestion() {

    document.getElementById("question").innerText =
      `What is ${num1} × ${num2}?`;

    document.getElementById("answer").value = "";

    document.getElementById("result").innerText = "";

    updateDisplays();

    document.getElementById("answer").focus();
  }


  function loadQuestion() {

    let savedNum1 = localStorage.getItem("num1");
    let savedNum2 = localStorage.getItem("num2");

    if (savedNum1 !== null && savedNum2 !== null) {

      num1 = parseInt(savedNum1);
      num2 = parseInt(savedNum2);

      showQuestion();

    } else {

      newQuestion();
    }
  }


  function checkAnswer() {

    let userAnswer =
      document.getElementById("answer").value;

    let correctAnswer = num1 * num2;

    let today = new Date().toDateString();


    if (parseInt(userAnswer) === correctAnswer) {

      document.getElementById("result").innerText =
        "✅ Correct!";


      if (lastPlayed !== today) {

        correctCount = 0;

        lastPlayed = today;

        localStorage.setItem(
          "lastPlayed",
          today
        );
      }


      correctCount++;

      localStorage.setItem(
        "correctCount",
        correctCount
      );


      if (correctCount >= 50) {

        streak++;

        correctCount = 0;

        localStorage.setItem(
          "streak",
          streak
        );

        localStorage.setItem(
          "correctCount",
          correctCount
        );

        alert(
          "🎉 You completed 50 questions today! Streak +1 day!"
        );
      }


      updateDisplays();

      setTimeout(newQuestion, 1000);

    }


    else {

      document.getElementById("result").innerText =
        "❌ Wrong. Try again!";

      correctCount = 0;

      localStorage.setItem(
        "correctCount",
        correctCount
      );

      updateDisplays();
    }
  }


  function updateDisplays() {

    document.getElementById("streak").innerText =
      `🔥 Current Streak: ${streak} days`;

    document.getElementById("progress").innerText =
      `📊 Progress: ${correctCount}/50 correct today`;
  }


  loadQuestion();

</script>

</body>
</html>
